# Nginx untuk FRONTEND Umira AI (mis. ai.umira.id → 127.0.0.1:3000)
# Dipasang oleh scripts/setup-ubuntu.sh. HTTPS: sudo certbot --nginx -d <domain>
#
# Bila backend berjalan di SERVER YANG SAMA dan Anda ingin satu domain saja
# (tanpa CORS, NEXT_PUBLIC_API_URL kosong), aktifkan blok "/api/" di bawah.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # --- (opsional) satu domain: teruskan /api ke backend lokal ---
  # location /api/ {
  #   proxy_pass http://127.0.0.1:4000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_set_header Connection '';
  #   proxy_buffering off;          # wajib untuk chat streaming (SSE)
  #   proxy_read_timeout 600s;
  # }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # untuk mode proxy Next.js (/api diteruskan oleh Next): jangan buffer SSE
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}
